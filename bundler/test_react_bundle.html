<!DOCTYPE html><html><body>
<div id="root"></div>
<script src="react_bundle.js"></script>
<script>
  window.__err = null;
  window.addEventListener('error', e => { window.__err = e.message; });
  try {
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement('div', {id:'test-el'}, 'HELLO ' + React.version));
  } catch(e) {
    window.__err = String(e && e.stack || e);
  }
</script>
</body></html>
